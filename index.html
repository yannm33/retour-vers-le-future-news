
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retour vers le futur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Permanent+Marker&family=Roboto:wght@300;400;700&family=Open+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Roboto', sans-serif;
      }
      .font-permanent-marker {
        font-family: 'Permanent Marker', cursive;
      }
      .font-open-sans {
        font-family: 'Open Sans', sans-serif;
      }
      .text-outline-white {
        text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
      }
      /* Custom styles for the time travel slider */
      .year-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 2px; /* Fine white thread */
        background: #ffffff;
        outline: none;
        opacity: 0.8;
        transition: opacity .2s;
        border-radius: 2px;
      }

      .year-slider:hover {
        opacity: 1;
      }

      /* Thumb for Webkit browsers (Chrome, Safari, etc.) */
      .year-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        background: #ff1111; /* Luminous red */
        cursor: pointer;
        border-radius: 50%;
        border: 2px solid white;
        margin-top: -8px; /* Center thumb on the track */
        box-shadow: 0 0 8px rgba(255, 17, 17, 0.9), 0 0 16px rgba(255, 17, 17, 0.7); /* Glow effect */
      }

      /* Thumb for Firefox */
      .year-slider::-moz-range-thumb {
        width: 14px;
        height: 14px;
        background: #ff1111; /* Luminous red */
        cursor: pointer;
        border-radius: 50%;
        border: 2px solid white;
        box-shadow: 0 0 8px rgba(255, 17, 17, 0.9), 0 0 16px rgba(255, 17, 17, 0.7); /* Glow effect */
      }

      /* Styles for the capsule toggle switch */
      .time-travel-switch {
        position: relative;
        display: inline-block;
        width: 60px;
        height: 34px;
      }

      .time-travel-switch-checkbox {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .time-travel-switch-slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #374151; /* gray-700 */
        -webkit-transition: .4s;
        transition: .4s;
        border-radius: 34px;
        border: 1px solid #4b5563; /* gray-600 */
      }

      .time-travel-switch-thumb {
        position: absolute;
        content: '';
        height: 26px;
        width: 26px;
        left: 4px;
        bottom: 4px;
        background-color: #ff1111; /* Luminous red */
        border: 2px solid white;
        border-radius: 50%;
        -webkit-transition: .4s;
        transition: .4s;
        box-shadow: 0 0 8px rgba(255, 17, 17, 0.9), 0 0 16px rgba(255, 17, 17, 0.7); /* Glow effect */
      }

      .time-travel-switch-checkbox:checked + .time-travel-switch-slider {
        background-color: #f59e0b; /* amber-500 */
      }

      .time-travel-switch-checkbox:checked + .time-travel-switch-slider .time-travel-switch-thumb {
        -webkit-transform: translateX(26px);
        -ms-transform: translateX(26px);
        transform: translateX(26px);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.14.0",

    "framer-motion": "https://esm.sh/framer-motion@^12.23.12",
    "clsx": "https://esm.sh/clsx@^2.1.1",
    "@tabler/icons-react": "https://aistudiocdn.com/@tabler/icons-react@^3.35.0"
  }
}
</script>

</head>
